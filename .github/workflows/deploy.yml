name: Desplegar en GitHub Pages

on:
  # Se ejecuta en cada push a la rama master.
  push:
    branches: [master]
  # Permite lanzarlo a mano desde la pestaña Actions.
  workflow_dispatch:

# Permisos necesarios para clonar el repo y crear el despliegue.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v7
      - name: Instalar, compilar y subir el sitio
        uses: withastro/action@v6
        with:
          node-version: 26

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
